<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">ICE train delay prediction illustration</title>
  <desc id="desc">A high-speed train, forecasting graph and data points on a dark blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2550"/>
      <stop offset="1" stop-color="#090e21"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#89b8ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity=".12" stroke="#75aaff">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>
  <path d="M70 365h665" stroke="#80b8ff" stroke-width="3" opacity=".65"/>
  <path d="M85 390h635" stroke="#80b8ff" stroke-width="2" opacity=".28"/>
  <g transform="translate(102 210)">
    <path d="M0 115 28 35Q36 8 68 5h245q40 0 79 37l48 46q18 17 8 37H18q-24 0-18-10Z" fill="url(#train)" opacity=".95"/>
    <path d="M54 29h228q26 0 55 27l20 18H38Z" fill="#122b55"/>
    <path d="M72 36h54v30H62Zm69 0h54v30h-54Zm69 0h54v30h-54Zm69 0h38l30 30h-68Z" fill="#4e8fe9" opacity=".7"/>
    <path d="M17 92h397" stroke="#ef3340" stroke-width="9"/>
    <circle cx="82" cy="127" r="17" fill="#071426" stroke="#85b8ff" stroke-width="5"/>
    <circle cx="344" cy="127" r="17" fill="#071426" stroke="#85b8ff" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#55d8ff" stroke-width="4" filter="url(#glow)">
    <path d="M444 252 508 220l54 20 62-85 88 31"/>
  </g>
  <g fill="#9cecff">
    <circle cx="444" cy="252" r="6"/><circle cx="508" cy="220" r="6"/><circle cx="562" cy="240" r="6"/><circle cx="624" cy="155" r="6"/><circle cx="712" cy="186" r="6"/>
  </g>
  <g transform="translate(592 282)">
    <circle r="60" fill="#071426" stroke="#73b5ff" stroke-width="5"/>
    <path d="M0-37V0l28 19" fill="none" stroke="#dff4ff" stroke-width="7" stroke-linecap="round"/>
    <circle r="5" fill="#dff4ff"/>
  </g>
</svg>
