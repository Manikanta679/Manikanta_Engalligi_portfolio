<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Video anomaly detection illustration</title>
  <desc id="desc">A surveillance camera analyzes video frames and highlights an anomalous person.</desc>
