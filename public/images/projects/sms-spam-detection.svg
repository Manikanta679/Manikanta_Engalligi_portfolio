<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">SMS spam detection illustration</title>
  <desc id="desc">Messages from a phone pass through an NLP filter and are classified as safe or spam.</desc>
  <defs>
