<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">O2C leakage detection illustration</title>
  <desc id="desc">An order-to-cash process path with a cash leak highlighted on a dark analytics background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2550"/>
      <stop offset="1" stop-color="#090e21"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity=".12" stroke="#75aaff">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>
  <g fill="none" stroke="#55d8ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M92 250h108"/>
    <path d="M248 250h108"/>
    <path d="M404 250h108"/>
    <path d="M560 250h78"/>
  </g>
  <g>
    <circle cx="92" cy="250" r="38" fill="#102a57" stroke="#73b5ff" stroke-width="4"/>
    <path d="M78 250h28M92 236v28" fill="none" stroke="#dff4ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="248" cy="250" r="38" fill="#102a57" stroke="#73b5ff" stroke-width="4"/>
    <path d="M232 262 248 238l16 24" fill="none" stroke="#dff4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="404" cy="250" r="38" fill="#102a57" stroke="#73b5ff" stroke-width="4"/>
    <rect x="390" y="236" width="28" height="28" rx="4" fill="none" stroke="#dff4ff" stroke-width="5"/>
    <circle cx="560" cy="250" r="38" fill="#102a57" stroke="#73b5ff" stroke-width="4"/>
    <circle cx="560" cy="250" r="14" fill="none" stroke="#dff4ff" stroke-width="5"/>
    <circle cx="710" cy="250" r="46" fill="#102a57" stroke="#73edbd" stroke-width="5" filter="url(#glow)"/>
    <text x="710" y="262" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" fill="#73edbd">&#8364;</text>
  </g>
  <g transform="translate(470 318)">
    <path d="M0 0c18 38 42 62 78 86" fill="none" stroke="#ff6a7f" stroke-width="5" stroke-dasharray="8 8" filter="url(#glow)"/>
    <circle cx="86" cy="96" r="28" fill="url(#coin)" stroke="#ffe08a" stroke-width="3"/>
    <text x="86" y="106" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#41230c">&#8364;</text>
  </g>
  <g transform="translate(620 78)" fill="none" stroke="#74eaff" stroke-width="3">
    <rect width="128" height="96" rx="10"/>
    <path d="M0 32h128M32 0v96M64 0v96M96 0v96M0 64h128" opacity=".45"/>
    <rect x="64" y="32" width="32" height="32" fill="#ff5d73" fill-opacity=".4" stroke="#ff8b9a"/>
  </g>
</svg>
